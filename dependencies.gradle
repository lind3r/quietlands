/*
 * Dependencies of Quiet Lands.
 *
 * The mod talks to RWG2 only through reflection, so nothing is needed at compile time. RWG2 is only added to the dev /
 * CI runtime (runClient, runServer), because the mod requires it to load. RWG2's generator references classes of the
 * mods in its POM directly (Et Futurum, LootGames, ...), so it comes with its dependencies; EndlessIDs (which RWG2
 * requires but doesn't list) is added separately. Mixins come from forceEnableMixins in gradle.properties.
 *
 * Versions match GTNH 2.9.0.
 */
dependencies {
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:Realistic-World-Gen-2:2.0.6:dev") {
        // optional RWG2 integration; the CurseForge jar is obfuscated and crashes a dev environment
        exclude group: "curse.maven", module: "witchery-69673"
    }
    runtimeOnlyNonPublishable("com.falsepattern:endlessids-mc1.7.10:1.7.4:dev")
}
